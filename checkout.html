<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <link rel="stylesheet" href="style.css">

  <!-- Top Banner Section with Image Background -->
  <header class="hero-banner">
    <img src="images/totebag.jpg" alt="totebag">
    <h1>Checkout</h1>
  </header>

  <!-- Form Content Area -->
  <main class="content-container">

    <h1>Checkout</h1>

    <div class="notice-box">
      Returning Customer? <a href="#">Click here to login</a>
    </div>

    <p class="form-instruction">
      If you have shopped with us before, please enter your details in the boxes below. If you are a new customer, please proceed to the Billing &amp; Shipping section.
    </p>

    <form class="login-form">
      <div class="form-row">
        <div class="form-field">
          <input type="text" placeholder="Username or Email *" required />
        </div>
        <div class="form-field">
          <input type="password" placeholder="Password *" required />
        </div>
      </div>

      <div class="action-row">
        <button type="submit" class="btn-login">LOG IN</button>
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          Remember me
        </label>
      </div>

      <div class="lost-password">
        <a href="#">Lost your password?</a>
      </div>
    </form>

  </main>


   <script src="script.js"></script>

</body>
</html>
