<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintXpress Hero Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- Right Panel (Blue background slideshow container) -->
    <div class="right-panel">
      <!-- 1st Slide: Logo inside the blue box -->
       <img src="images/logo.jpg" alt="logo" width="300px" height="300px">

      <!-- 2nd Slide: Discount text -->
      <div class="discount animate-item">60% Discount</div>

      <!-- 3rd Slide: Main Title -->
      <div class="title-brand animate-item">printXpress</div>

      <!-- 4th Slide: Collection Title -->
      <div class="title-sub animate-item">Collection</div>

      <!-- 5th Slide: Subtitle Tagline -->
      <div class="tagline animate-item">Best Cloth Collection By 2026!</div>

      <!-- 6th Slide: Action Button -->
      <a href="#" class="shop-btn animate-item">Shop Now</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
