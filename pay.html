 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <link rel="stylesheet" href="style.css">

    <div class="checkout-card">
        <h2>Your Order Summary</h2>
        <div class="item-row">
            <span>Oversized Vintage Hoodie (x1)</span>
            <strong>N30,000</strong>
        </div>
        <hr>
        <form id="paymentForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email-address" placeholder="customer@email.com" required />
            </div>
            <div class="form-group">
                <label for="amount">Total Amount (N)</label>
                <input type="number" id="amount" value="30" readonly />
            </div>
            
            <a href="proceedtopay.html">
                <button type="button" id="pay-btn" style="height: 90px; width: 120px;">Proceed to Pay</button>
            </a>
        </form>
    </div>

    

    <!-- Paystack Inline JS Library -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
